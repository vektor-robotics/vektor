name: Bug report
description: Report reproducible incorrect behavior in VEKTOR
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: VEKTOR version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Ubuntu, ROS distribution, RMW, and architecture
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      render: shell
