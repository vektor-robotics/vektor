name: Feature request
description: Propose a focused improvement to VEKTOR
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Fleet or robot use case
      description: What operational problem should VEKTOR solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
