syntax = "proto3";

package vektor.agent.v1;

enum HealthState {
  HEALTH_STATE_UNSPECIFIED = 0;
  HEALTH_STATE_HEALTHY = 1;
  HEALTH_STATE_DEGRADED = 2;
  HEALTH_STATE_UNHEALTHY = 3;
  HEALTH_STATE_UNREACHABLE = 4;
}

enum CheckStatus {
  CHECK_STATUS_UNSPECIFIED = 0;
  CHECK_STATUS_PASS = 1;
  CHECK_STATUS_WARN = 2;
  CHECK_STATUS_FAIL = 3;
}

message CheckResult {
  CheckStatus status = 1;
  string category = 2;
  string target = 3;
  string message = 4;
  int64 duration_ms = 5;
}

message StatusSnapshot {
  uint32 schema_version = 1;
  string timestamp = 2;
  string robot_id = 3;
  string hostname = 4;
  int32 ros_domain_id = 5;
  HealthState state = 6;
  int64 duration_ms = 7;
  repeated CheckResult checks = 8;
  uint64 sequence = 9;
}

message GetStatusRequest {}

message WatchStatusRequest {}

enum DeploymentPhase {
  DEPLOYMENT_PHASE_UNSPECIFIED = 0;
  DEPLOYMENT_PHASE_IDLE = 1;
  DEPLOYMENT_PHASE_STAGED = 2;
  DEPLOYMENT_PHASE_ACTIVE = 3;
  DEPLOYMENT_PHASE_ROLLED_BACK = 4;
  DEPLOYMENT_PHASE_FAILED = 5;
}

enum RuntimeNetworkMode {
  RUNTIME_NETWORK_MODE_UNSPECIFIED = 0;
  RUNTIME_NETWORK_MODE_HOST = 1;
  RUNTIME_NETWORK_MODE_BRIDGE = 2;
  RUNTIME_NETWORK_MODE_NONE = 3;
}

enum ReconciliationOperation {
  RECONCILIATION_OPERATION_UNSPECIFIED = 0;
  RECONCILIATION_OPERATION_NONE = 1;
  RECONCILIATION_OPERATION_PREPARING = 2;
  RECONCILIATION_OPERATION_ACTIVATING = 3;
  RECONCILIATION_OPERATION_ROLLING_BACK = 4;
  RECONCILIATION_OPERATION_VERIFYING = 5;
}

message EnvironmentVariable {
  string name = 1;
  string value = 2;
}

message BindMount {
  string source = 1;
  string target = 2;
  bool read_only = 3;
}

message DeviceMapping {
  string host_path = 1;
  string container_path = 2;
}

message RuntimeWorkloadSpec {
  RuntimeNetworkMode network = 1;
  string restart_policy = 2;
  repeated EnvironmentVariable environment = 3;
  repeated BindMount mounts = 4;
  repeated DeviceMapping devices = 5;
  repeated string command = 6;
}

message DeploymentRecord {
  uint32 schema_version = 1;
  string deployment_id = 2;
  string artifact = 3;
  string previous_artifact = 4;
  DeploymentPhase phase = 5;
  string message = 6;
  string updated_at = 7;
  string observed_artifact = 8;
  string runtime_id = 9;
  bool runtime_running = 10;
  bool drift_detected = 11;
  bool runtime_managed = 12;
  RuntimeWorkloadSpec workload = 13;
  RuntimeWorkloadSpec previous_workload = 14;
  string workload_fingerprint = 15;
  string observed_workload_fingerprint = 16;
  bool runtime_ready = 17;
  string runtime_readiness_status = 18;
  ReconciliationOperation reconciliation_operation = 19;
  string operation_started_at = 20;
  uint64 operation_attempt = 21;
  bool artifact_verified = 22;
  string verification_method = 23;
  string verified_signer = 24;
  string verified_issuer = 25;
  string verified_at = 26;
}

message PrepareDeploymentRequest {
  string deployment_id = 1;
  string artifact = 2;
  RuntimeWorkloadSpec workload = 3;
  int64 operation_timeout_ms = 4;
}

message ActivateDeploymentRequest {
  string deployment_id = 1;
  int64 operation_timeout_ms = 2;
  int64 readiness_timeout_ms = 3;
  bool allow_degraded = 4;
}

message RollbackDeploymentRequest {
  string deployment_id = 1;
  int64 operation_timeout_ms = 2;
}

message GetDeploymentRequest {}

service Agent {
  rpc GetStatus(GetStatusRequest) returns (StatusSnapshot);
  rpc WatchStatus(WatchStatusRequest) returns (stream StatusSnapshot);
  rpc PrepareDeployment(PrepareDeploymentRequest) returns (DeploymentRecord);
  rpc ActivateDeployment(ActivateDeploymentRequest) returns (DeploymentRecord);
  rpc RollbackDeployment(RollbackDeploymentRequest) returns (DeploymentRecord);
  rpc GetDeployment(GetDeploymentRequest) returns (DeploymentRecord);
}
